<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>JavaScript</title>
</head>
<body>
    <main>

        <section id="classificador">
            <form id="form">
                <h1 id="title">
                    Calculadora
                </h1>

                <div class="input-box">
                    <div class="input-field">
                        <label for="codigo">Código do funcionário: </label>
                        <input type="number" id="codigo" required>
                    </div>
                </div>

                <div class="input-box">
                    <div class="input-field">
                        <label for="horas">Horas trabalhadas no mês:</label>
                        <input type="number" id="horas" required>
                    </div>
                </div>

                <div class="input-box">
                    <div class="input-field">
                        <label>Turno:</label><br>
                        <input type="radio" name="turno" value="M" required> Matutino
                        <input type="radio" name="turno" value="V"> Vespertino
                        <input type="radio" name="turno" value="N"> Noturno
                    </div>
                </div>

                <div class="input-box">
                    <div class="input-field">
                        <label>Categoria:</label><br>
                        <input type="radio" name="categoria" value="F" required> Funcionário
                        <input type="radio" name="categoria" value="G"> Gerente
                    </div>
                </div>

                <div class="input-box">
                    <div class="input-field">
                        <label for="salarioMinimo">Salário mínimo estadual:</label>
                        <input type="number" id="salarioMinimo" required>
                    </div>
                </div>

                <button id="Calculadora">
                    Calcular
                </button>

            </form>
        </section>
    </main>
    <script src="javascript.js"></script>
</body>
</html>
