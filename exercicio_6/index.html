<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>JavaScript</title>
</head>
<body>
    <main>

        <section id="classificador">
            <form id="form">
                <h1 id="title">
                    Calculadora
                </h1>

                <div class="input-box">
                    <div class="input-field">
                        <label for="quantidade">Número: </label>
                        <input type="number" id="numero1" required>
                    </div>
                </div>
                
                <div class="input-box">
                    <div class="input-field">
                        <label for="distancia">Número: </label>
                        <input type="number" id="numero2" required>
                    </div>
                </div>

                <div class="input-box">
                    <div class="input-field">
                        <label for="distancia">Operação: </label>
                        <input type="text" id="operacao" required>
                    </div>
                </div>

                <button id="Calculadora">
                    Calcular
                </button>

            </form>
        </section>
    </main>
    <script src="javascript.js"></script>
</body>
</html>
